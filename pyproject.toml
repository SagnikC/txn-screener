[project]
name = "function"
description = "txn-screener: UPI-style payment risk check for the Vayu Functions demo"
version = "0.2.0"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
  "httpx",
  "pytest",
  "pytest-asyncio"
]
authors = [
  { name="Vayu Functions demo" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["function"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
